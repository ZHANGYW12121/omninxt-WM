schema: omninxt_server_sim_sync_v1
date: '2026-08-02'
runtime_flight_controller_required: false
coordinate_frames:
  body:
    name: base_link
    convention: ROS_FLU
    axes: {x: forward, y: left, z: up}
  optical:
    convention: OpenCV
    axes: {x: right, y: down, z: forward}
matrix_convention: T_target_source maps homogeneous source coordinates to target
physical_cameras:
  resolution: [1280, 720]
  model: Mei_omni_plus_radtan
  mapping:
    CAM_A: FRONT_RIGHT
    CAM_B: REAR_RIGHT
    CAM_C: REAR_LEFT
    CAM_D: FRONT_LEFT
  clockwise_order: [CAM_A, CAM_B, CAM_C, CAM_D]
  assembled_order: [CAM_A, CAM_B, CAM_C, CAM_D]
  rotate_180: false
anchor_views:
  resolution: [416, 320]
  horizontal_fov_deg: 120.0
  mosaic_resolution: [832, 640]
  mosaic_layout: [[CAM_A, CAM_B], [CAM_C, CAM_D]]
rectified_stereo:
  resolution: [320, 240]
  pairs:
    - {id: 0, name: A_B_RIGHT, left: CAM_A, right: CAM_B, physical_side: right}
    - {id: 1, name: B_C_REAR, left: CAM_B, right: CAM_C, physical_side: rear}
    - {id: 2, name: C_D_LEFT, left: CAM_C, right: CAM_D, physical_side: left}
    - {id: 3, name: D_A_FRONT, left: CAM_D, right: CAM_A, physical_side: front}
  stereo_mosaic_resolution: [640, 960]
  stereo_mosaic_rows: [A_B_RIGHT, B_C_REAR, C_D_LEFT, D_A_FRONT]
depth:
  model: models/hitnet_1x240x320_model_float16_quant_opt.onnx
  input: {name: input, dtype: float32, shape: [1, 2, 240, 320], scale: 0_to_1}
  output: {name: reference_output_disparity, dtype: float32, shape: [1, 240, 320, 1], unit: pixel}
  disparity_sign: u_left_minus_u_right
  depth_definition: rectified_left_optical_Z
  formal_disparity_filter_enabled: false
skeleton:
  detector: models/yolox_nano_coco_416.onnx
  pose: models/rtmpose_s_body17_256x192.onnx
  topology: COCO17
  output_schema: omninxt.skeleton3d.v1
  identity_tracking:
    association: ego_motion_compensated_predicted_3d_motion
    joint_filter: constant_velocity_kalman_with_measurement_covariance
    covariance_frame_update: rotate_with_synced_ego_pose
    output_kinematic_refinement: learned_symmetric_bone_length_projection
    kinematic_projection_changes_temporal_provenance: false
    articulated_pose_confirmation_frames: 2
    low_geometry_confirmation_frames: 7
    detection_only_confirmation_frames: 10
    minimum_public_body_joints: 4
    minimum_public_core_joints: 2
    core_joint_indices: [5, 6, 11, 12]
    coherent_full_body_relocalization: true
    whole_body_plausibility_gate: conservative_when_six_or_more_bones_exist
    tracking_frame: base_link_reexpressed_each_frame_from_synced_world_pose
    episode_reset_source: synchronized_episode_generation
    small_frame_assignment: exact_max_cardinality_min_cost
    small_frame_max_measurements: 12
    dense_frame_assignment: hungarian
    dense_frame_complexity: O(N^3)
    numeric_id_convention: positive_per_process
    process_identity_field: session_id
    globally_unique_track_field: track_uid
    optional_person_fields:
      - track_state
      - identity_confidence
      - track_age_frames
      - time_since_observation_ms
      - id_uncertain
      - root_velocity_base_link_mps
      - velocity_valid
      - velocity_sigma_mps
      - consecutive_prediction_frames
    velocity_contract: >-
      root_velocity_base_link_mps is a causal, ego-motion-compensated robust
      estimate built from the current and past observations of the same track.
      velocity_valid, velocity_sigma_mps, track age, measurement age, and
      consecutive_prediction_frames travel with the estimate. Consumers must
      not reconstruct policy input velocity from a one-frame position
      difference, and simulator privileged velocity is never policy input.
    maximum_output_range_m: 6.0
    internal_range_exit_hysteresis_m: 0.25
    range_definition: euclidean_base_link
  synchronized_ego_state:
    topic: /omninxt/ego_pose
    message: std_msgs/String
    payload_schema: omninxt.ego_pose.v1
    frame: world
    child_frame: base_link
    timestamp: exact_camera_render_timestamp
    fields: [timestamp_ns, episode_generation, position_world_m, attitude_xyzw]
    quaternion_order: xyzw
  network_transport: newline_delimited_JSON_over_TCP
  stgcn_layout: [N, C, T, V, M]
  stgcn_channels: [x_m, y_m, z_m, confidence, coordinate_valid]
  joint_count: 17
  default_window_frames: 30
  default_max_people: 4
  source_codes:
    0: invalid
    1: stereo_geometry
    2: hitnet
    3: temporal_prediction
    4: other
    5: isaac_gt_depth
  simulation_recording_source: isaac_gt_depth
  simulation_recording_semantics: >-
    COCO-17 image keypoints and tracking remain detector outputs, while each
    valid 3D joint is lifted from the exact-timestamp Isaac distance_to_camera
    ground truth converted to rectified optical-Z. Isaac animation joints are
    privileged labels only and must not be substituted into the observation.
authoritative_geometry:
  - calibration/fisheye_cams.yaml
  - calibration/stereo_calib_0_1_240_320.yaml
  - calibration/stereo_calib_1_2_240_320.yaml
  - calibration/stereo_calib_2_3_240_320.yaml
  - calibration/stereo_calib_3_0_240_320.yaml
  - derived/sim_geometry.yaml
nonportable_files:
  - '*.engine'
  - '*.trt'
